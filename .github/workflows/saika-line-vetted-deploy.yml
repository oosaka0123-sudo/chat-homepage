name: Saika LINE vetted PHP production update
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check only or deploy three PHP files
        type: choice
        required: true
        default: check
        options:
          - check
          - deploy
      confirmation:
        description: For deploy type DEPLOY-SAIKA-LINE
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: saika-php-target-only
  cancel-in-progress: false
jobs:
  release:
    if: github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    env:
      FTP_USER: ${{ secrets.CHAT_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout pinned tested Saika patch
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/wakayama-saika-club
          ref: a61082fb6c948da41d5116aea219f0de3a462096
          fetch-depth: 0
          path: .saika-source
          persist-credentials: false
      - name: Validate safe scope and PHP syntax
        run: |
          set -euo pipefail
          test "$MODE" = 'check' || test "$MODE" = 'deploy'
          if [ "$MODE" = 'deploy' ]; then
            test "$CONFIRMATION" = 'DEPLOY-SAIKA-LINE' || { echo 'Explicit deployment confirmation missing'; exit 1; }
          fi
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo 'Existing Lolipop credentials unavailable'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli php-mbstring
          for file in webhook.php lib/posts.php lib/messages.php; do
            test -s ".saika-source/line-api/$file"
            php -l ".saika-source/line-api/$file"
          done
      - name: Back up exactly three live PHP files
        id: backup
        run: |
          set -euo pipefail
          mkdir -p .before/lib .expected/lib
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          cd /saika/public/line-api
          get webhook.php -o .before/webhook.php
          get lib/posts.php -o .before/lib/posts.php
          get lib/messages.php -o .before/lib/messages.php
          bye
          LFTP
          # All three live files were verified against this exact original source revision.
          for file in webhook.php lib/posts.php lib/messages.php; do
            git -C .saika-source show "e5a022158899df4fefa4115a20ad79b9f2408895:line-api/$file" > ".expected/$file"
            cmp ".expected/$file" ".before/$file" || {
              echo "Live $file changed since review. No upload attempted."
              exit 1
            }
          done
          echo 'Backup and precise three-file preflight passed.'
      - name: Upload only Saika LINE PHP, never private data or other websites
        id: upload
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          cd /saika/public/line-api
          put .saika-source/line-api/lib/messages.php -o lib/messages.php
          put .saika-source/line-api/lib/posts.php -o lib/posts.php
          put .saika-source/line-api/webhook.php -o webhook.php
          bye
          LFTP
      - name: Verify exact bytes and public API
        id: verify
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          mkdir -p .after/lib
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          cd /saika/public/line-api
          get webhook.php -o .after/webhook.php
          get lib/posts.php -o .after/lib/posts.php
          get lib/messages.php -o .after/lib/messages.php
          bye
          LFTP
          for file in webhook.php lib/posts.php lib/messages.php; do
            cmp ".saika-source/line-api/$file" ".after/$file"
          done
          curl --fail --silent --show-error --max-time 25 --output /dev/null 'https://saika.rss7.net/line-api/feed.php'
          echo 'Saika patch verified. All three deployed PHP files byte-identical to approved source; feed HTTP success.'
      - name: Rollback three PHP files if upload or verification fails
        if: failure() && steps.backup.outcome == 'success' && inputs.mode == 'deploy' && (steps.upload.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          set -euo pipefail
          test -s .before/webhook.php
          test -s .before/lib/posts.php
          test -s .before/lib/messages.php
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          cd /saika/public/line-api
          put .before/lib/messages.php -o lib/messages.php
          put .before/lib/posts.php -o lib/posts.php
          put .before/webhook.php -o webhook.php
          bye
          LFTP
          echo 'Restored the previous Saika LINE PHP version. Private data and photos were untouched.'
