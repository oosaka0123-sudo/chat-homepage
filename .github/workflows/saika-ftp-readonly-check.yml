name: Saika production FTP read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saika-ftp-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install FTPS tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Get Saika history for code fingerprinting
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/wakayama-saika-club
          fetch-depth: 0
          path: .saika-source
          persist-credentials: false
      - name: Inspect only the Saika LINE files
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo 'Chat-host FTPS credentials are unavailable'; exit 1; }
          mkdir -p .saika-readonly/lib
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          cd /saika/public/line-api
          get webhook.php -o .saika-readonly/webhook.php
          get lib/posts.php -o .saika-readonly/lib/posts.php
          get lib/messages.php -o .saika-readonly/lib/messages.php
          bye
          LFTP
          test -s .saika-readonly/webhook.php
          test -s .saika-readonly/lib/posts.php
          test -s .saika-readonly/lib/messages.php
          echo 'Read-only access to exactly three Saika LINE files: success'
          sha256sum .saika-readonly/webhook.php .saika-readonly/lib/posts.php .saika-readonly/lib/messages.php
          for file in webhook.php lib/posts.php lib/messages.php; do
            actual=$(git -C .saika-source hash-object "../.saika-readonly/$file")
            if git -C .saika-source cat-file -e "$actual" 2>/dev/null; then
              echo "$file: FOUND_IN_REPOSITORY_HISTORY"
              for rev in $(git -C .saika-source rev-list --all); do
                known=$(git -C .saika-source rev-parse "$rev:line-api/$file" 2>/dev/null || true)
                if [ "$known" = "$actual" ]; then
                  echo "$file: matching revision ${rev:0:12}"
                  break
                fi
              done
            else
              echo "$file: NOT_IN_REPOSITORY_HISTORY"
            fi
            diff --brief ".saika-readonly/$file" ".saika-source/line-api/$file" || true
            diff -u ".saika-readonly/$file" ".saika-source/line-api/$file" | grep '^@@' | head -25 || true
          done
          echo 'Read-only inspection complete; no server writes.'
