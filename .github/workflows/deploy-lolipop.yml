name: Deploy chat.rss7.net

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chat-lolipop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy/assets/css .deploy/assets/js
          cp index.html favicon.svg robots.txt sitemap.xml .nojekyll .htaccess .deploy/
          cp assets/css/styles.css .deploy/assets/css/
          cp assets/js/main.js .deploy/assets/js/
          mkdir -p .deploy/demos/salon .deploy/demos/cafe .deploy/demos/reform
          cp demos/salon/index.html demos/salon/styles.css .deploy/demos/salon/
          cp demos/cafe/index.html demos/cafe/styles.css .deploy/demos/cafe/
          cp demos/reform/index.html demos/reform/styles.css .deploy/demos/reform/
          test -f .deploy/index.html
          test -f .deploy/.htaccess
          test -f .deploy/assets/css/styles.css
          test -f .deploy/assets/js/main.js
          test -f .deploy/demos/salon/index.html
          test -f .deploy/demos/cafe/index.html
          test -f .deploy/demos/reform/index.html
          ! find .deploy -iname '*.md' | grep -q .

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy by explicit FTPS
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          mirror --reverse --verbose=1 --no-perms ./.deploy/ /chat
          bye
          LFTP_EOF

      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 4 https://chat.rss7.net/ > /tmp/chat.html
          grep -q 'https://chat.rss7.net/' /tmp/chat.html
          grep -q 'ホームページは' /tmp/chat.html
