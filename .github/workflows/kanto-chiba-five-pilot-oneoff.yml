name: One-off Kanto Chiba five-spot Lolipop deployment
on:
  push:
    branches: [ops/kanto-chiba-five-pilot-20261127]
    paths: ['.github/workflows/kanto-chiba-five-pilot-oneoff.yml']
permissions:
  contents: read
concurrency:
  group: kanto-best9-lolipop-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION: https://kanto.rss7.net
    steps:
      - name: Checkout exact verified Kanto commit
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/kanto-surfer-ks
          ref: b4f673ffdd06a275d1271816444197cebbe95a7f
          path: kanto-src
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, openssl
          coverage: none
      - name: Build all nine full-hour forecasts and validate D8 D2 D3 CS ZF
        shell: bash
        run: |
          set -euo pipefail
          php -l kanto-src/scripts/build_pages_site.php
          php -l kanto-src/scripts/build_public_forecast.php
          php -l kanto-src/scripts/tide_jma.php
          node --check kanto-src/prototype/spot-forecast/app.js
          # Use the one verified and successful main Pages build. Never re-fetch Open-Meteo here:
          # 9 weather endpoints returned HTTP 429 when this was run alongside the data sync.
          curl -fsSL --retry 3 --max-time 45 \
            'https://github.com/oosaka0123-sudo/kanto-surfer-ks/releases/download/kanto-data-snapshot-20261127-b4f673f/kanto-nine-data-b4f673f.tar' \
            -o "$RUNNER_TEMP/chiba-data.tar"
          echo 'd703cbe7e17a4ff42988f8dc07a7c633bd3b2930e1275c4d3ac862ea2668e5aa  '"$RUNNER_TEMP/chiba-data.tar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/verified"
          tar -xf "$RUNNER_TEMP/chiba-data.tar" -C "$RUNNER_TEMP/verified"
          test "$(find "$RUNNER_TEMP/verified/data" -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          python3 - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified/data'
          js=json.loads((root/'index.json').read_text())
          expected={'kugenuma':'D8','yuigahama':'D8','oarai_onuki':'D3','kashima_hirai':'D2','katakai':'CS','ichinomiya':'ZF','taito':'ZF','onjuku':'ZF','kamogawa_maruki':'ZF'}
          stamp=set()
          for id,station in expected.items():
              d=json.loads((root/(id+'.json')).read_text())
              if d['spot']['id']!=id or d['tide']['station_id']!=station: raise RuntimeError('Wrong spot or tide station '+id)
              if len(d.get('hourly',[]))<70 or len(d.get('daily',{}).get('rows',[]))!=10: raise RuntimeError('Forecast gaps '+id)
              stamp.add(d['generated_at'])
          if len(stamp)!=1: raise RuntimeError('Inconsistent generation timestamps')
          ts=datetime.datetime.fromisoformat(stamp.pop())
          now=datetime.datetime.now(datetime.timezone.utc)
          if not datetime.datetime(2026,11,26,22,tzinfo=datetime.timezone.utc)<=ts<=now or now-ts>datetime.timedelta(hours=4):
              raise RuntimeError('Stale or future immutable forecast snapshot')
          print('PASS: one verified main build reused, no API retry')
          PY
          node kanto-src/tests/kugenuma_hourly_smoke.cjs "$RUNNER_TEMP/verified/data"
          php kanto-src/scripts/build_pages_site.php --public-dir="$RUNNER_TEMP/verified/data" --output-dir="$RUNNER_TEMP/built"
          for pair in kugenuma:D8 yuigahama:D8 oarai_onuki:D3 kashima_hirai:D2 katakai:CS ichinomiya:ZF taito:ZF onjuku:ZF kamogawa_maruki:ZF; do
            id="${pair%:*}"; station="${pair#*:}"
            jq -e --arg id "$id" --arg station "$station" '.spot.id==$id and .tide.station_id==$station and ([.hourly[].precipitation_probability_pct|select(.!=null)]|length)>=17' "$RUNNER_TEMP/built/data/$id.json" >/dev/null
          done
          for slug in katakai ichinomiya taito onjuku kamogawa-maruki; do
            f="$RUNNER_TEMP/built/spots/$slug/index.html"
            grep -q 'CHIBA_GOOGLE_MAP_START' "$f"
            grep -q 'CHIBA_WINDY_START' "$f"
            grep -q '駐車場へ行く（Googleマップ）' "$f"
            grep -q 'data-spot-advice' "$f"
            if grep -q 'kugenuma-hero-muted.mp4' "$f"; then echo "Kugenuma video leaked to $slug" >&2; exit 1; fi
            if grep -q '35.3148611' "$f"; then echo "Kugenuma coordinates leaked to $slug" >&2; exit 1; fi
          done
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Back up, preserve five research articles, upload and verify fifteen files
        shell: bash
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import os, pathlib, subprocess, re, json
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          base=tmp/'built'
          backup=tmp/'backup'
          stage=tmp/'stage'
          spot_ids=['kugenuma','yuigahama','oarai_onuki','kashima_hirai','katakai','ichinomiya','taito','onjuku','kamogawa_maruki']
          chiba=[('katakai','katakai'),('ichinomiya','ichinomiya'),('taito','taito'),('onjuku','onjuku'),('kamogawa_maruki','kamogawa-maruki')]
          files=['app.js']+['data/'+id+'.json' for id in spot_ids]+['spots/'+slug+'/index.html' for _,slug in chiba]
          if len(files)!=15 or len(set(files))!=15: raise RuntimeError('Unexpected release scope')
          if not os.getenv('FTP_USER') or not os.getenv('FTP_PASSWORD'):
              raise RuntimeError('Existing FTPS secrets unavailable')
          for rel in files:
              for root in (backup,stage):
                  (root/rel).parent.mkdir(parents=True,exist_ok=True)
              (stage/rel).write_bytes((base/rel).read_bytes())
          def ftp_run(commands):
              cfg=['set cmd:fail-exit true','set ftp:ssl-force true',
                   'set ftp:ssl-protect-data true','set ssl:verify-certificate true',
                   'set ftp:passive-mode true','set net:timeout 20','set net:max-retries 3',
                   'open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp.lolipop.jp']
              cmd='\n'.join(cfg+commands+['bye'])+'\n'
              r=subprocess.run(['lftp'],input=cmd,text=True,capture_output=True,timeout=240)
              if r.returncode: raise RuntimeError('FTPS failed with exit status '+str(r.returncode))
          def http_get(rel,key):
              url=os.environ['PRODUCTION']+'/'+rel+'?chiba_'+key+'='+os.environ.get('GITHUB_RUN_ID','0')
              r=subprocess.run(['curl','-4','-fsSL','--retry','3','--max-time','30',
                                '-H','Cache-Control: no-cache',url],capture_output=True,timeout=150)
              if r.returncode: raise RuntimeError('HTTP fetch failed: '+rel)
              return r.stdout
          ftp_run(['get "/kanto/'+rel+'" -o "'+str(backup/rel)+'"' for rel in files])
          for rel in files:
              actual=http_get(rel,'preflight')
              if actual!=(backup/rel).read_bytes(): raise RuntimeError('Existing production mismatch: '+rel)
          # Preserve exact morning/evening article bytes. Do not rerender or resummarize research.
          for id,slug in chiba:
              rel='spots/'+slug+'/index.html'
              old=(backup/rel).read_bytes()
              out=(stage/rel).read_bytes()
              pat=re.compile(b'<!-- KS-RESEARCH:'+id.encode()+b':START -->.*?<!-- KS-RESEARCH:'+id.encode()+b':END -->',re.S)
              old_match=pat.findall(old)
              if len(old_match)!=1: raise RuntimeError('Research marker absent/duplicated: '+id)
              if pat.search(out): raise RuntimeError('New page unexpectedly includes old research')
              at=out.find(b'<section class="forecast-section"')
              if at<0: raise RuntimeError('Camera insertion point missing: '+id)
              out=out[:at]+old_match[0]+out[at:]
              if pat.findall(out)!=old_match: raise RuntimeError('Research data changed: '+id)
              if out.count(b'<h1')!=1 or out.count(b'data-forecast')<1: raise RuntimeError('Missing UI: '+id)
              if not(out.index(b'CHIBA_WINDY_START')<out.index(b'CHIBA_GOOGLE_MAP_START')<out.index(b'</main>')):
                  raise RuntimeError('Map order incorrect: '+id)
              (stage/rel).write_bytes(out)
          for rel in files:
              if http_get(rel,'before_upload')!=(backup/rel).read_bytes():
                  raise RuntimeError('Concurrent production update blocked release: '+rel)
          print('PASS: backup, existing daily reports and exact 15-file scope validated')
          touched=False
          try:
              touched=True
              ftp_run(['put "'+str(stage/rel)+'" -o "/kanto/'+rel+'"' for rel in files])
              for rel in files:
                  if http_get(rel,'post_upload')!=(stage/rel).read_bytes():
                      raise RuntimeError('Public byte mismatch after deploy: '+rel)
              print('PASS: Chiba 5 site HTML + 9 JSON + compatible app.js, all fifteen public files exact')
          except Exception:
              if touched:
                  try:
                      ftp_run(['put "'+str(backup/rel)+'" -o "/kanto/'+rel+'"' for rel in files])
                      print('ROLLBACK: all fifteen original files restored')
                  except Exception:
                      print('CRITICAL: rollback failed, inspect live site immediately',flush=True)
              raise
          PY
