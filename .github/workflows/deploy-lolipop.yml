name: Deploy chat.rss7.net

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'
      - '.htaccess'
      - 'google10b52f5d3ce8d9fd.html'
      - 'assets/**'
      - 'service/**'
      - 'price/**'
      - 'flow/**'
      - 'faq/**'
      - 'demos/**'
      - 'guide/**'
      - '.github/workflows/deploy-lolipop.yml'

permissions:
  contents: read

concurrency:
  group: deploy-chat-lolipop
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://chat.rss7.net
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          set -euo pipefail
          rm -rf .deploy .rollback
          mkdir -p .deploy/assets/css .deploy/assets/js .deploy/assets/img
          cp index.html favicon.svg robots.txt sitemap.xml .nojekyll .htaccess google10b52f5d3ce8d9fd.html .deploy/
          cp assets/css/styles.css .deploy/assets/css/
          cp assets/js/main.js assets/js/common-menu.js .deploy/assets/js/
          cp assets/img/chat-homepage-logo.png .deploy/assets/img/
          mkdir -p .deploy/service .deploy/price .deploy/flow .deploy/faq .deploy/demos/salon .deploy/demos/cafe .deploy/demos/reform .deploy/guide/context .deploy/guide/setup .deploy/guide/free-limits .deploy/guide/direct-edit
          cp service/index.html .deploy/service/
          cp price/index.html .deploy/price/
          cp flow/index.html .deploy/flow/
          cp faq/index.html .deploy/faq/
          cp demos/index.html .deploy/demos/
          cp demos/salon/*.html demos/salon/styles.css .deploy/demos/salon/
          cp demos/cafe/*.html demos/cafe/styles.css .deploy/demos/cafe/
          cp demos/reform/*.html demos/reform/styles.css .deploy/demos/reform/
          cp guide/index.html guide/styles.css guide/guide.js .deploy/guide/
          cp guide/context/index.html guide/context/context.css .deploy/guide/context/
          cp guide/setup/index.html guide/setup/setup.css .deploy/guide/setup/
          cp guide/free-limits/index.html guide/free-limits/free-limits.css .deploy/guide/free-limits/
          cp guide/direct-edit/index.html .deploy/guide/direct-edit/
          printf '%s\n' "$GITHUB_SHA" > .deploy/release.txt
          test -f .deploy/index.html
          test -f .deploy/.htaccess
          test -f .deploy/google10b52f5d3ce8d9fd.html
          test -f .deploy/release.txt
          test -f .deploy/assets/img/chat-homepage-logo.png
          test -f .deploy/assets/js/common-menu.js
          test -f .deploy/service/index.html
          test -f .deploy/price/index.html
          test -f .deploy/flow/index.html
          test -f .deploy/faq/index.html
          test -f .deploy/demos/index.html
          test -f .deploy/demos/salon/index.html
          test -f .deploy/demos/cafe/index.html
          test -f .deploy/demos/reform/index.html
          test -f .deploy/guide/index.html
          test -f .deploy/guide/styles.css
          test -f .deploy/guide/guide.js
          test -f .deploy/guide/context/index.html
          test -f .deploy/guide/context/context.css
          test -f .deploy/guide/setup/index.html
          test -f .deploy/guide/setup/setup.css
          test -f .deploy/guide/free-limits/index.html
          test -f .deploy/guide/free-limits/free-limits.css
          test -f .deploy/guide/direct-edit/index.html
          grep -q 'noindex,nofollow' .deploy/guide/index.html
          grep -q 'noindex,nofollow' .deploy/guide/context/index.html
          grep -q 'noindex,nofollow' .deploy/guide/setup/index.html
          grep -q 'noindex,nofollow' .deploy/guide/free-limits/index.html
          grep -q 'noindex,nofollow' .deploy/guide/direct-edit/index.html
          test "$(grep -RIl '/assets/js/common-menu.js' .deploy --include='index.html' | wc -l)" -eq 14
          ! find .deploy -iname '*.md' | grep -q .
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Backup current production
        id: backup
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          mkdir -p .rollback
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          mirror --verbose=0 /chat/ ./.rollback/
          bye
          LFTP_EOF

      - name: Deploy by explicit FTPS
        id: upload
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          deploy_once() {
            lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          mirror --reverse --verbose=1 --no-perms ./.deploy/ /chat/
          bye
          LFTP_EOF
          }
          deploy_once || { sleep 10; deploy_once; }

      - name: Verify production release
        id: verify
        run: |
          set -euo pipefail
          bust="${GITHUB_SHA:0:12}-$(date +%s)"
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/?v=$bust" > /tmp/chat.html
          grep -q 'https://chat.rss7.net/' /tmp/chat.html
          grep -q 'ホームページは' /tmp/chat.html
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/release.txt?v=$bust" > /tmp/release.txt
          grep -Fxq "$GITHUB_SHA" /tmp/release.txt
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/google10b52f5d3ce8d9fd.html?v=$bust" > /tmp/google-verification.html
          grep -Fxq 'google-site-verification: google10b52f5d3ce8d9fd.html' /tmp/google-verification.html
          for path in service/ price/ flow/ demos/ faq/ demos/salon/ demos/cafe/ demos/reform/ guide/ guide/context/ guide/setup/ guide/free-limits/ guide/direct-edit/; do
            curl --fail --silent --show-error --retry 3 -o /dev/null \
              "$PRODUCTION_URL/$path?v=$bust"
          done
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/guide/context/?v=$bust" > /tmp/context.html
          grep -q 'context-final' /tmp/context.html
          grep -q 'data-copy' /tmp/context.html
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/guide/direct-edit/?v=$bust" > /tmp/direct-edit.html
          grep -q 'ホームページを直接編集したい方へ' /tmp/direct-edit.html
          for asset in assets/img/chat-homepage-logo.png guide/styles.css guide/guide.js guide/context/context.css guide/setup/setup.css guide/free-limits/free-limits.css; do
            curl --fail --silent --show-error --retry 3 -o /dev/null \
              "$PRODUCTION_URL/$asset?v=$bust"
          done
      - name: Restore previous production on failure
        if: failure() && steps.backup.outcome == 'success' && (steps.upload.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -d .rollback ] || [ -z "$(find .rollback -mindepth 1 -print -quit)" ]; then
            echo "No previous production backup is available; leaving the failed run visible."
            exit 0
          fi
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp.lolipop.jp
          mirror --reverse --verbose=1 --no-perms ./.rollback/ /chat/
          bye
          LFTP_EOF
          echo "Previous production files restored. The workflow remains failed for investigation."
