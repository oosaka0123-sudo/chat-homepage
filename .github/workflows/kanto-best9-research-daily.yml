name: Kanto BEST9 researched articles to Lolipop

on:
  schedule:
    - cron: '15 23 * * *'
    - cron: '15 0-2 * * *'
    - cron: '45 10 * * *'
    - cron: '15 11-13 * * *'
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanto-best9-lolipop-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Kanto source of truth
        uses: actions/checkout@v4
        with:
          repository: oosaka0123-sudo/kanto-surfer-ks
          ref: main
          path: kanto-src
          persist-credentials: false

      - name: Install existing FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Verify morning and evening research, back up and safely publish
        shell: bash
        env:
          FTP_USER: ${{ secrets.CHAT_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.CHAT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import datetime, json, math, os, pathlib, re, subprocess, sys, tempfile
          from zoneinfo import ZoneInfo

          now=datetime.datetime.now(ZoneInfo('Asia/Tokyo'))
          today=now.date().isoformat()
          base=pathlib.Path('kanto-src')
          config=json.loads((base/'config/representative-spots.json').read_text(encoding='utf-8'))
          spots=config['spots']
          assert len(spots)==9
          slugs=[s['slug'] for s in spots]
          assert all(re.fullmatch(r'[a-z0-9-]+', slug) for slug in slugs)
          files=['index.html']+['spots/'+slug+'/index.html' for slug in slugs]
          print('JST date:',today,'research mode: morning/evening v2')

          root=pathlib.Path(tempfile.mkdtemp(prefix='kanto-best9-'))
          public=root/'public'
          backup=root/'backup'
          stage=root/'stage'
          for d in (public,backup,stage):
              for rel in files: (d/rel).parent.mkdir(parents=True,exist_ok=True)

          def page_shape_ok(rel, content):
              if content.count(b'</main>') != 1:
                  return False
              if rel == 'index.html':
                  start = b'<!-- KS-MODEL:ranking:START -->'
                  end = b'<!-- KS-MODEL:ranking:END -->'
                  return (content.count(start) == content.count(end) == 1
                          and content.index(start) < content.index(end) < content.index(b'</main>')
                          and not any(x in content for x in (b'data-forecast', b'id="forecast-title"', b'id="daily-forecast"')))
              spot = rel.split('/')[1].replace('-', '_').encode('ascii')
              return all(re.search(pattern, content) for pattern in (
                  rb'<div\b[^>]*\bdata-forecast(?=\s|>)[^>]*\bdata-data-base="\.\./\.\./data/"[^>]*\bdata-default-spot="' + re.escape(spot) + rb'"[^>]*>',
                  rb'<svg\b[^>]*\bdata-chart(?=\s|>)[^>]*>',
                  rb'<section\b[^>]*\bid="daily-forecast"[^>]*\bdata-daily(?=\s|>)[^>]*>',
                  rb'<table\b[^>]*>[\s\S]*?<tbody\b[^>]*\bdata-daily-body(?=\s|>)[^>]*>',
              ))

          # The actual forecast rows and graph are rendered by app.js from data/*.json.
          # Verify the live payload separately; do not demand static rows in HTML.
          def payload_ok(spot, data):
              def number(v):
                  return type(v) in (int, float) and math.isfinite(v) and v >= 0
              hourly = data.get('hourly')
              rows = data.get('daily', {}).get('rows')
              if (data.get('spot', {}).get('id') != spot or not isinstance(hourly, list)
                      or not hourly or not isinstance(rows, list) or len(rows) != 10):
                  return False
              if not any(isinstance(h, dict)
                         and number(h.get('wave_height_m', h.get('model_wave_height_m')))
                         and number(h.get('wind_speed_ms')) for h in hourly):
                  return False
              dates = []
              for i, row in enumerate(rows):
                  if (not isinstance(row, dict)
                          or not all(k in row for k in ('model_wave_height_min_m', 'model_wave_height_max_m', 'wind_speed_mean_ms'))
                          or not number(row['wind_speed_mean_ms'])):
                      return False
                  lo, hi = row['model_wave_height_min_m'], row['model_wave_height_max_m']
                  # Marine's coverage can end on day 9 while weather covers day 10.
                  # Allow an explicit missing wave pair only on the last date, never fabricate it.
                  if not (i == 9 and lo is None and hi is None):
                      if not (number(lo) and number(hi) and lo <= hi):
                          return False
                  try:
                      dates.append(datetime.date.fromisoformat(row['date']))
                  except (KeyError, TypeError, ValueError):
                      return False
              return all(b - a == datetime.timedelta(days=1) for a, b in zip(dates, dates[1:]))

          # Regression checks before any network or FTPS writes.
          home = b'<!-- KS-MODEL:ranking:START --><!-- KS-MODEL:ranking:END --></main>'
          detail = (b'<div data-forecast data-data-base="../../data/" data-default-spot="kugenuma">'
                    b'<svg data-chart aria-hidden="true"></svg></div>'
                    b'<section id="daily-forecast" data-daily aria-label="daily">'
                    b'<table><tbody data-daily-body aria-label="body"></tbody></table></section></main>')
          assert page_shape_ok('index.html', home)
          assert page_shape_ok('spots/kugenuma/index.html', detail)
          assert not page_shape_ok('index.html', detail)
          assert not page_shape_ok('index.html', home + b'data-forecast')
          assert not page_shape_ok('index.html', home.replace(b'END', b'START'))
          assert not page_shape_ok('spots/kugenuma/index.html', home)
          assert not page_shape_ok('spots/kugenuma/index.html', detail.replace(b'id="daily-forecast"', b''))
          assert not page_shape_ok('index.html', home.replace(b'</main>', b''))
          assert not page_shape_ok('spots/kugenuma/index.html', detail.replace(b'data-chart', b''))
          assert not page_shape_ok('spots/kugenuma/index.html', detail.replace(b'data-daily-body', b''))
          assert not page_shape_ok('spots/kugenuma/index.html', detail.replace(b'kugenuma', b'yuigahama'))
          sample = {'spot': {'id': 'kugenuma'},
                    'hourly': [{'wave_height_m': 0.5, 'wind_speed_ms': 2}],
                    'daily': {'rows': [
                        {'date': (datetime.date(2026, 1, 1) + datetime.timedelta(days=i)).isoformat(),
                         'model_wave_height_min_m': 0.4, 'model_wave_height_max_m': 0.6,
                         'wind_speed_mean_ms': 2} for i in range(10)]}}
          assert not payload_ok('kugenuma', {**sample, 'hourly': [{}]})
          assert not payload_ok('kugenuma', {**sample, 'daily': {'rows': [{}] * 10}})
          assert payload_ok('kugenuma', sample)
          last_missing = {**sample['daily']['rows'][-1], 'model_wave_height_min_m': None, 'model_wave_height_max_m': None}
          assert payload_ok('kugenuma', {**sample, 'daily': {'rows': sample['daily']['rows'][:-1] + [last_missing]}})
          first_missing = {**sample['daily']['rows'][0], 'model_wave_height_min_m': None, 'model_wave_height_max_m': None}
          assert not payload_ok('kugenuma', {**sample, 'daily': {'rows': [first_missing] + sample['daily']['rows'][1:]}})
          assert not payload_ok('yuigahama', sample)
          assert not payload_ok('kugenuma', {**sample, 'hourly': []})
          assert not payload_ok('kugenuma', {**sample, 'daily': {'rows': []}})
          assert not payload_ok('kugenuma', {**sample, 'daily': {'rows': [{}] * 9}})
          print('PASS: chartless home, forecast rendering hooks and payload regression checks')

          def fetch_public(rel, salt):
              url='https://kanto.rss7.net/'+rel.removesuffix('index.html')+'?best9_check='+salt+'-'+os.environ.get('GITHUB_RUN_ID','0')
              out=root/('http-'+str(files.index(rel))+'.html')
              proc=subprocess.run(['curl','-4','-fsSL','--retry','3','--max-time','30','-H','Cache-Control: no-cache',url,'-o',str(out)],capture_output=True,text=True)
              if proc.returncode: raise RuntimeError('Public page fetch failed for '+rel)
              content=out.read_bytes()
              if not page_shape_ok(rel, content): raise RuntimeError('Unexpected live page: '+rel)
              return content

          for rel in files: (public/rel).write_bytes(fetch_public(rel,'preflight'))
          # This publisher never overwrites JSON; the model sync job owns it.
          for slug in slugs:
              spot=slug.replace('-', '_')
              url='https://kanto.rss7.net/data/'+spot+'.json?research_check='+os.environ.get('GITHUB_RUN_ID','0')
              proc=subprocess.run(['curl','-4','-fsSL','--retry','3','--max-time','30','-H','Cache-Control: no-cache',url],capture_output=True)
              if proc.returncode or not payload_ok(spot,json.loads(proc.stdout)):
                  raise RuntimeError('Forecast payload missing or invalid: '+spot)
          print('PASS: all nine live forecast payloads have hourly values and ten daily rows')

          if not os.environ.get('FTP_USER') or not os.environ.get('FTP_PASSWORD'):
              raise RuntimeError('Existing Lolipop FTPS secrets not configured')

          def ftp_run(commands):
              command=['set cmd:fail-exit true','set ftp:ssl-force true','set ftp:ssl-protect-data true','set ssl:verify-certificate true','set ftp:passive-mode true','set net:timeout 20','set net:max-retries 3',
                       'open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp.lolipop.jp'] + commands + ['bye']
              proc=subprocess.run(['lftp'],input='\n'.join(command)+'\n',capture_output=True,text=True,timeout=300)
              if proc.returncode: raise RuntimeError('FTPS transfer failed (exit '+str(proc.returncode)+')')

          ftp_run(['get "/kanto/'+rel+'" -o "'+str(backup/rel)+'"' for rel in files])
          for rel in files:
              if (backup/rel).read_bytes()!=(public/rel).read_bytes():
                  raise RuntimeError('Production drift, refusing to overwrite: '+rel)

          # Match only the two legacy Kugenuma sections, not adjacent forecast sections.
          def migrate_kugenuma(raw):
              map_pattern=rb'<section class="forecast-section kugenuma-access-map"[^>]*>.*?</section>'
              article_pattern=rb'<section class="forecast-section" aria-labelledby="ks-article-title">.*?</section>'
              maps=list(re.finditer(map_pattern,raw,re.S))
              if len(maps)!=1: raise RuntimeError('Unexpected Kugenuma map count')
              old_articles=list(re.finditer(article_pattern,raw,re.S))
              if len(old_articles)>1: raise RuntimeError('Duplicate legacy article')
              if old_articles and b'ks-gpt-article' not in old_articles[0].group(): raise RuntimeError('Unexpected legacy article')
              result=re.sub(article_pattern,b'',raw,flags=re.S)
              map_match=re.search(map_pattern,result,re.S)
              section=map_match.group()
              result=result[:map_match.start()]+result[map_match.end():]
              if result.count(b'</main>')!=1: raise RuntimeError('Unexpected Kugenuma main')
              return result.replace(b'</main>',section+b'\n  </main>',1)
          expected={}
          for rel in files:
              raw=(backup/rel).read_bytes()
              if rel=='spots/kugenuma/index.html':
                  # Once moved, retain exact bytes on every subsequent update.
                  map_pos=raw.find(b'id="kugenuma-access-map"')
                  daily_pos=raw.find(b'id="daily-forecast"')
                  if b'aria-labelledby="ks-article-title"' in raw or map_pos<daily_pos:
                      raw=migrate_kugenuma(raw)
                  if not (raw.find(b'id="daily-forecast"')<raw.find(b'id="kugenuma-access-map"')<raw.find(b'</main>')):
                      raise RuntimeError('Kugenuma map position not verified')
              expected[rel]=raw
              (stage/rel).write_bytes(raw)
          proc=subprocess.run(['node',str(base/'scripts/render_research_v2.cjs'),
                    '--root',str(stage),'--research-dir',str(base/'content/research'),
                    '--config',str(base/'config/representative-spots.json')],capture_output=True,text=True)
          if proc.returncode: raise RuntimeError('Research validation rejected publication: '+proc.stderr[-900:])
          print(proc.stdout.strip())

          marker=re.compile(rb'<!-- KS-RESEARCH:[a-z0-9_]+:START -->.*?<!-- KS-RESEARCH:[a-z0-9_]+:END -->',re.S)
          changed=[]
          for rel in files:
              old=(backup/rel).read_bytes()
              new=(stage/rel).read_bytes()
              if marker.sub(b'',expected[rel])!=marker.sub(b'',new):
                  raise RuntimeError('Unsafe change outside article/ranking markers: '+rel)
              if not page_shape_ok(rel, new):
                  raise RuntimeError('Lost existing forecast content: '+rel)
              if new!=old: changed.append(rel)
          if not changed:
              print('PASS / NO CHANGE: all current live pages already match desired research content')
              sys.exit(0)

          for rel in changed:
              if fetch_public(rel,'before-upload')!=(backup/rel).read_bytes():
                  raise RuntimeError('Concurrent production change detected, aborting: '+rel)

          print('Safe changed pages:',len(changed),'of 10. Backups verified; uploading HTML only.')
          upload_started=False
          try:
              upload_started=True
              ftp_run(['put "'+str(stage/rel)+'" -o "/kanto/'+rel+'"' for rel in changed])
              for rel in files:
                  if fetch_public(rel,'verify')!=(stage/rel).read_bytes():
                      raise RuntimeError('Post-deploy public byte comparison failed: '+rel)
              print('PASS: morning/evening research published on Lolipop, all ten public files matched byte-for-byte')
          except Exception:
              if upload_started:
                  try:
                      ftp_run(['put "'+str(backup/rel)+'" -o "/kanto/'+rel+'"' for rel in changed])
                      print('ROLLBACK: all affected HTML restored from verified backup')
                  except Exception:
                      print('CRITICAL: rollback failed; inspect GitHub Action and live site immediately',file=sys.stderr)
              raise
          PY
